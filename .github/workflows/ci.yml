name: CI

on:
  push:
    branches: [main, 'feat/**', 'ci/**']
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            lane: f1
          - php: '8.4'
            lane: f2
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
          extensions: curl, dom, mbstring, openssl, pdo, tokenizer, xml, xmlwriter, zip

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Composer validate
        run: composer validate --no-check-publish --strict

      - name: Allow Flarum 1 flysystem advisories
        if: matrix.lane == 'f1'
        run: composer config --global --json policy.advisories.ignore-id '["PKSA-w9tt-7782-78jx","PKSA-pwh8-d4fr-nywn"]'

      - name: Install PHP dependencies
        run: composer update --no-interaction --prefer-dist

      - name: Assert resolved Flarum core
        run: |
          if [ "${{ matrix.lane }}" = "f2" ]; then
            composer show flarum/core | grep -E '^versions\s+:\s+\* v2\.0\.2$'
            composer show league/flysystem | grep -E '^versions\s+:\s+\* 3\.'
          else
            composer show flarum/core | grep -E '^versions\s+:\s+\* v1\.8\.'
          fi

      - name: PHP syntax check
        run: |
          find src tests extend.php extend-f2.php -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: PHPUnit
        run: vendor/bin/phpunit --colors=always

      - name: JS install
        working-directory: js
        run: npm ci

      - name: JS tests
        working-directory: js
        run: npm test

      - name: Production build
        working-directory: js
        run: npm run build

  flarum-f2-http:
    name: Flarum 2.0.2 private-message HTTP
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: curl, dom, fileinfo, gd, mbstring, openssl, pdo, pdo_sqlite, tokenizer, xml, xmlwriter, zip
      - name: Disposable Flarum 2 HTTP acceptance
        run: bash scripts/ci-flarum-f2-http.sh
